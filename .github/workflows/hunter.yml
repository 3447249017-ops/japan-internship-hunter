name: Internship Hunter V3
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 5' # 09:00 JST Friday (UTC+9), delay possible
permissions:
  contents: read
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check code
        run: python -m unittest discover -s tests -v
      - name: Fetch published job boards
        run: python hunter.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internship-hunter-v3-results
          path: output/
          if-no-files-found: warn
          retention-days: 30
