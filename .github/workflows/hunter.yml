
name: Internship Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 5"

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run internship hunter
        run: python hunter.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internship-leads
          path: output/
          if-no-files-found: warn
